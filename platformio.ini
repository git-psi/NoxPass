[platformio]
default_envs = m5stick-s3-hid

[env:m5stick-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; PSRAM 8 Mo (ESP32-S3 N8R8 = PSRAM octale) : les gros blocs (> 16 Ko) y sont alloués automatiquement
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
; M5PM1 = puce d'alimentation du StickS3 : permet de récupérer le double clic du bouton latéral (core/PowerKey)
lib_deps =
    m5stack/M5Unified
    m5stack/M5GFX
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/m5stack/M5PM1/archive/refs/heads/main.zip

; Même firmware, mais l'USB devient un clavier. Le flash demande le mode téléchargement manuel.
[env:m5stick-s3-hid]
extends = env:m5stick-s3
build_flags =
    ${env:m5stick-s3.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0